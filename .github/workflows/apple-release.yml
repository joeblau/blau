name: Apple Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover
        required: true
        type: string
      successful_mobile_run_id:
        description: Prior Apple Release run with both TestFlight jobs successful
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: apple-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      build-number: ${{ steps.release.outputs.build-number }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          SUCCESSFUL_MOBILE_RUN_ID: ${{ github.event.inputs.successful_mobile_run_id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$REQUESTED_TAG"
          fi
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tags must use vMAJOR.MINOR.PATCH: %s\n' \
              "$release_tag" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "refs/tags/$release_tag:refs/tags/$release_tag" \
            main:refs/remotes/origin/main
          release_commit="$(git rev-parse "refs/tags/$release_tag^{commit}")"
          git merge-base --is-ancestor \
            "$release_commit" refs/remotes/origin/main || {
            printf 'Release tag is not on origin/main: %s\n' \
              "$release_tag" >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$SUCCESSFUL_MOBILE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              printf 'Invalid prior Apple Release run ID: %s\n' \
                "$SUCCESSFUL_MOBILE_RUN_ID" >&2
              exit 1
            }
            run="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SUCCESSFUL_MOBILE_RUN_ID")"
            jq -e \
              --arg tag "$release_tag" \
              --arg commit "$release_commit" \
              '.status == "completed" and
               .event == "push" and
               .head_branch == $tag and
               .head_sha == $commit' <<< "$run" >/dev/null || {
              printf '%s\n' \
                'Prior run does not belong to this release tag and commit.' >&2
              exit 1
            }
            jobs="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$SUCCESSFUL_MOBILE_RUN_ID/jobs?filter=latest&per_page=100")"
            for name in 'TestFlight (Copilot)' 'TestFlight (Plotter)'; do
              jq -e --arg name "$name" \
                '.jobs | any(.name == $name and .conclusion == "success")' \
                <<< "$jobs" >/dev/null || {
                printf 'Prior run did not complete successfully: %s\n' \
                  "$name" >&2
                exit 1
              }
            done
          fi

          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${release_tag#v}" >> "$GITHUB_OUTPUT"
          printf 'build-number=%s.%s\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  macos:
    name: Signed and notarized Pilot
    needs: release-metadata
    runs-on: macos-26
    environment: apple-release
    timeout-minutes: 240
    permissions:
      attestations: read
      contents: read
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 }}
      BLAU_CHROMIUM_CODESIGN_TIMESTAMP: YES
      BLAU_SOURCE_PACKAGES: ${{ github.workspace }}/apple/.release-source-packages
      CEF_DOWNLOAD_CACHE: ${{ github.workspace }}/apple/.release-cef-download-cache
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      RELEASE_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
          ref: ${{ needs.release-metadata.outputs.tag }}
      - name: Install the recovered release test harness
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:apple/bin/test-chromium-runtime.sh" \
            > "$RUNNER_TEMP/test-chromium-runtime.sh"
          install -m 755 "$RUNNER_TEMP/test-chromium-runtime.sh" \
            apple/bin/test-chromium-runtime.sh
      - name: Require release credentials
        shell: bash
        run: |
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 \
            MACOS_CERTIFICATE_P12 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_SIGNING_IDENTITY \
            SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || {
              printf 'Missing apple-release secret: %s\n' "$name" >&2
              exit 1
            }
          done
      - name: Verify supported Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 26\.'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apple/.release-source-packages
            apple/.release-cef-download-cache
          key: apple-release-macos-${{ runner.os }}-${{ runner.arch }}-xcode26-${{ hashFiles('apple/blau.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apple/Packages/GhosttyKit/Package.swift', 'apple/Packages/ChromiumKit/Package.swift', 'apple/Packages/ChromiumKit/cef-artifacts.json') }}
      - name: Import Developer ID identity
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ runner.temp }}-${{ github.run_id }}
        run: |
          keychain="$RUNNER_TEMP/apple-release-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id-application.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode \
            > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" \
            -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep -F "$MACOS_SIGNING_IDENTITY"
          printf 'RELEASE_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
      - name: Install App Store Connect API key
        shell: bash
        run: |
          key_directory="$RUNNER_TEMP/private_keys"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_directory"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64" |
            base64 --decode > "$key_path"
          chmod 600 "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path"
          printf 'APP_STORE_CONNECT_KEY_PATH=%s\n' "$key_path" \
            >> "$GITHUB_ENV"
      - name: Install the pinned Chromium runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags release the reviewed lock exactly. Upstream freshness is a
          # ChromiumKit maintenance concern, not a reproducible-release gate.
          bash apple/bin/package-chromiumkit.sh manifest

          release_id="$(jq -r '.releaseID' \
            apple/Packages/ChromiumKit/cef-artifacts.json)"
          runtime_tag="chromiumkit-$release_id"
          runtime_directory="$RUNNER_TEMP/chromiumkit-release"
          mkdir -p "$runtime_directory"

          if gh release view "$runtime_tag" >/dev/null 2>&1; then
            gh release verify "$runtime_tag"
            for asset in \
              ChromiumKitCEF.runtime.zip \
              ChromiumKitCEF.release.json \
              ChromiumKitCEF.checksums.txt; do
              gh release download "$runtime_tag" \
                --pattern "$asset" --dir "$runtime_directory"
              gh release verify-asset \
                "$runtime_tag" "$runtime_directory/$asset"
            done
            apple/bin/update-chromiumkit-artifact.sh \
              --release-directory "$runtime_directory"
          else
            printf '%s\n' \
              'No immutable ChromiumKit release found; reproducing the pinned runtime.'
            apple/bin/update-chromiumkit-artifact.sh
          fi
      - name: Generate and verify the Xcode project
        run: |
          apple/bin/install-xcodegen.sh generate \
            --spec apple/project.yml --project apple
          git diff --exit-code -- apple/blau.xcodeproj
          apple/bin/app-icon-tool.swift validate
      - name: Run the signed Chromium release gates
        env:
          BLAU_CHROMIUM_TEST_CODE_SIGN_IDENTITY: ${{ env.MACOS_SIGNING_IDENTITY }}
          BLAU_CHROMIUM_TEST_DEVELOPMENT_TEAM: ${{ env.APPLE_TEAM_ID }}
          BLAU_CHROMIUM_TEST_RESULT_ROOT: ${{ runner.temp }}/chromium-gate-results
        run: |
          for architecture in arm64 x86_64; do
            DEVELOPER_DIR="$(xcode-select -p)" \
            BLAU_CHROMIUM_TEST_ARCHITECTURE="$architecture" \
              apple/bin/test-chromium-runtime.sh
          done
      - name: Upload Chromium gate results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-gate-results
          path: ${{ runner.temp }}/chromium-gate-results
          if-no-files-found: ignore
      - name: Archive signed universal Pilot
        shell: bash
        # OTHER_CODE_SIGN_FLAGS=--timestamp: Xcode signs embedded frameworks
        # on copy with --timestamp=none, but the post-notarization validation
        # requires trusted timestamps on every framework root (Sparkle,
        # RoyalVNCKit).
        run: |
          archive="$RUNNER_TEMP/Pilot.xcarchive"
          xcodebuild archive \
            -project apple/blau.xcodeproj \
            -scheme Pilot \
            -configuration Chromium \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive" \
            -derivedDataPath "$RUNNER_TEMP/Pilot-derived-data" \
            -clonedSourcePackagesDirPath "$BLAU_SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER"
          apple/bin/validate-chromium-archive.sh "$archive"
          [[ "$(plutil -extract CFBundleShortVersionString raw \
            "$archive/Products/Applications/Pilot.app/Contents/Info.plist")" \
            == "$RELEASE_VERSION" ]]
          [[ "$(plutil -extract CFBundleVersion raw \
            "$archive/Products/Applications/Pilot.app/Contents/Info.plist")" \
            == "$RELEASE_BUILD_NUMBER" ]]
      - name: Notarize and staple Pilot
        shell: bash
        run: |
          app="$RUNNER_TEMP/Pilot.xcarchive/Products/Applications/Pilot.app"
          submission="$RUNNER_TEMP/Pilot-notarization.zip"
          ditto -c -k --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$APP_STORE_CONNECT_KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait --timeout 45m
          xcrun stapler staple "$app"
          apple/bin/validate-chromium-archive.sh \
            --require-notarization "$app"
      - name: Package the macOS download
        shell: bash
        run: |
          release_directory="$RUNNER_TEMP/apple-release"
          asset="Pilot-${RELEASE_VERSION}-macOS.zip"
          mkdir -p "$release_directory"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/Pilot.xcarchive/Products/Applications/Pilot.app" \
            "$release_directory/$asset"
          (
            cd "$release_directory"
            shasum -a 256 "$asset" > "$asset.sha256"
            shasum -a 256 -c "$asset.sha256"
          )
      - name: Sign the Sparkle update
        shell: bash
        run: |
          sparkle_version="2.9.5"
          sparkle_sha256="015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc"
          tools="$RUNNER_TEMP/sparkle-tools"
          mkdir -p "$tools"
          curl -sSfL -o "$tools/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$sparkle_version/Sparkle-$sparkle_version.tar.xz"
          printf '%s  %s\n' "$sparkle_sha256" "$tools/sparkle.tar.xz" |
            shasum -a 256 -c -
          tar -xf "$tools/sparkle.tar.xz" -C "$tools"

          release_directory="$RUNNER_TEMP/apple-release"
          asset="$release_directory/Pilot-${RELEASE_VERSION}-macOS.zip"
          # The EdDSA private key streams in via stdin; it is never written to
          # the runner's disk.
          signing_output="$(printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$tools/bin/sign_update" --ed-key-file - "$asset")"
          signature="$(sed -n \
            's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' \
            <<<"$signing_output")"
          length="$(sed -n 's/.*length="\([^"]*\)".*/\1/p' \
            <<<"$signing_output")"
          [[ -n "$signature" && -n "$length" ]] || {
            printf 'Sparkle signing produced no signature: %s\n' \
              "$signing_output" >&2
            exit 1
          }

          pub_date="$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/Pilot-${RELEASE_VERSION}-macOS.zip"
          cat > "$release_directory/appcast-item.xml" <<EOF
          <item>
            <title>Version $RELEASE_VERSION</title>
            <pubDate>$pub_date</pubDate>
            <sparkle:version>$RELEASE_BUILD_NUMBER</sparkle:version>
            <sparkle:shortVersionString>$RELEASE_VERSION</sparkle:shortVersionString>
            <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
            <enclosure url="$download_url"
              length="$length"
              type="application/octet-stream"
              sparkle:edSignature="$signature"/>
          </item>
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-${{ needs.release-metadata.outputs.version }}
          path: ${{ runner.temp }}/apple-release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove signing credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP/developer-id-application.p12" \
            "${APP_STORE_CONNECT_KEY_PATH:-$RUNNER_TEMP/missing-key}"

  testflight:
    name: TestFlight (${{ matrix.scheme }})
    needs: release-metadata
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-26
    environment: apple-release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - Copilot
          - Plotter
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 }}
      BLAU_SOURCE_PACKAGES: ${{ github.workspace }}/apple/.release-source-packages
      RELEASE_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build-number }}
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: true
      - name: Require release credentials
        shell: bash
        run: |
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64; do
            [[ -n "${!name:-}" ]] || {
              printf 'Missing apple-release secret: %s\n' "$name" >&2
              exit 1
            }
          done
      - name: Verify supported Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 26\.'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apple/.release-source-packages
          key: apple-release-mobile-${{ runner.os }}-${{ runner.arch }}-xcode26-${{ hashFiles('apple/blau.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'apple/Packages/GhosttyKit/Package.swift') }}
      - name: Install App Store Connect API key
        shell: bash
        run: |
          key_directory="$RUNNER_TEMP/private_keys"
          key_path="$key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_directory"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64" |
            base64 --decode > "$key_path"
          chmod 600 "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path"
          printf 'APP_STORE_CONNECT_KEY_PATH=%s\n' "$key_path" \
            >> "$GITHUB_ENV"
      - name: Generate and verify the Xcode project
        run: |
          apple/bin/install-xcodegen.sh generate \
            --spec apple/project.yml --project apple
          git diff --exit-code -- apple/blau.xcodeproj
          apple/bin/app-icon-tool.swift validate
      - name: Archive ${{ matrix.scheme }}
        shell: bash
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          archive="$RUNNER_TEMP/$SCHEME.xcarchive"
          xcodebuild archive \
            -project apple/blau.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            -derivedDataPath "$RUNNER_TEMP/$SCHEME-derived-data" \
            -clonedSourcePackagesDirPath "$BLAU_SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER"

          app_plist="$archive/Products/Applications/$SCHEME.app/Info.plist"
          [[ "$(plutil -extract CFBundleShortVersionString raw "$app_plist")" \
            == "$RELEASE_VERSION" ]]
          [[ "$(plutil -extract CFBundleVersion raw "$app_plist")" \
            == "$RELEASE_BUILD_NUMBER" ]]
      - name: Upload ${{ matrix.scheme }} to TestFlight
        shell: bash
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          export_options="$RUNNER_TEMP/TestFlightExportOptions.plist"
          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string upload "$export_options"
          plutil -insert signingStyle -string automatic "$export_options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$export_options"
          plutil -insert manageAppVersionAndBuildNumber \
            -bool false "$export_options"
          plutil -insert uploadSymbols -bool true "$export_options"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/$SCHEME-export" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove App Store Connect API key
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "${APP_STORE_CONNECT_KEY_PATH:-$RUNNER_TEMP/missing-key}"

  publish:
    name: Publish GitHub release
    needs:
      - release-metadata
      - macos
      - testflight
    if: >-
      ${{
        always() &&
        needs.release-metadata.result == 'success' &&
        needs.macos.result == 'success' &&
        (needs.testflight.result == 'success' ||
          (github.event_name == 'workflow_dispatch' &&
            needs.testflight.result == 'skipped'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-release-${{ needs.release-metadata.outputs.version }}
          path: ${{ runner.temp }}/apple-release
      - name: Verify release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/apple-release"
          asset="Pilot-${RELEASE_VERSION}-macOS.zip"
          [[ -f "$asset" && -f "$asset.sha256" && -s appcast-item.xml ]]
          [[ "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" == 3 ]]
          grep -q 'sparkle:edSignature="[^"]\+"' appcast-item.xml
          shasum -a 256 -c "$asset.sha256"
      - name: Publish the tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && {
            printf 'Refusing to replace existing release: %s\n' \
              "$RELEASE_TAG" >&2
            exit 1
          }

          # Chain the Sparkle appcast off the previous app release's feed so
          # older installs keep their full update history. The item for this
          # release was signed in the macOS job; only assembly happens here.
          previous_tag="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[].tag_name | select(startswith("v"))][0] // empty')"
          if [[ -n "$previous_tag" ]]; then
            gh release download "$previous_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern appcast.xml \
              --dir "$RUNNER_TEMP" \
              --clobber 2>/dev/null || true
          fi
          python3 - "$RUNNER_TEMP/apple-release/appcast-item.xml" \
            "$RUNNER_TEMP/appcast.xml" <<'PY'
          import pathlib
          import sys
          import xml.dom.minidom

          item_path = pathlib.Path(sys.argv[1])
          appcast_path = pathlib.Path(sys.argv[2])
          item = item_path.read_text(encoding="utf-8").strip()

          skeleton = """<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0"
            xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle"
            xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>blau updates</title>
              <link>https://github.com/joeblau/blau/releases/latest/download/appcast.xml</link>
              <description>Most recent changes with links to updates for blau.</description>
              <language>en</language>
          </channel>
          </rss>
          """
          text = (
              appcast_path.read_text(encoding="utf-8")
              if appcast_path.exists()
              else skeleton
          )
          if "</channel>" not in text:
              sys.exit("Existing appcast is malformed: no </channel>")
          text = text.replace("</channel>", item + "\n  </channel>", 1)
          # Guard: the feed must stay well-formed (namespaces included).
          xml.dom.minidom.parseString(text)
          appcast_path.write_text(text, encoding="utf-8")
          PY

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest=true \
            --title "blau $RELEASE_VERSION" \
            --generate-notes \
            "$RUNNER_TEMP/apple-release/Pilot-${RELEASE_VERSION}-macOS.zip" \
            "$RUNNER_TEMP/apple-release/Pilot-${RELEASE_VERSION}-macOS.zip.sha256" \
            "$RUNNER_TEMP/appcast.xml"
