name: ChromiumKit Upstream Support

on:
  schedule:
    - cron: "17 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromiumkit-upstream-support
  cancel-in-progress: true

jobs:
  verify-support:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Require latest supported stable Chromium
        run: bash apple/bin/verify-chromiumkit-support.sh
