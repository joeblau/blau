<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>File input fixture</title>
  <link rel="stylesheet" href="/assets/fixture.css">
  <script defer src="/assets/fixture.js"></script>
</head>
<body>
  <main>
    <h1>File chooser policy</h1>
    <label>
      Select a text fixture
      <input id="file-input" type="file" accept="text/plain">
    </label>
    <output id="selection">none</output>
  </main>
  <script>
    document.querySelector("#file-input").addEventListener("change", (event) => {
      const file = event.target.files[0];
      document.querySelector("#selection").value =
        file ? `${file.name}:${file.size}` : "none";
    });
  </script>
</body>
</html>
