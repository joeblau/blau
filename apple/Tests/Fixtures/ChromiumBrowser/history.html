<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>History fixture</title>
  <link rel="stylesheet" href="/assets/fixture.css">
  <script defer src="/assets/fixture.js"></script>
</head>
<body>
  <main>
    <h1>pushState and history</h1>
    <button id="push" type="button">Push state</button>
    <button id="replace" type="button">Replace state</button>
    <button id="back" type="button">History back</button>
    <pre id="log">initial</pre>
  </main>
  <script>
    const log = document.querySelector("#log");
    const record = (event) => {
      log.textContent += `\n${event}: ${location.pathname}${location.search}`;
    };
    document.querySelector("#push").addEventListener("click", () => {
      history.pushState({ fixture: "pushed" }, "", "?entry=pushed");
      record("pushState");
    });
    document.querySelector("#replace").addEventListener("click", () => {
      history.replaceState({ fixture: "replaced" }, "", "?entry=replaced");
      record("replaceState");
    });
    document.querySelector("#back").addEventListener("click", () => history.back());
    addEventListener("popstate", () => record("popstate"));
  </script>
</body>
</html>
