<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Popup fixture</title>
  <link rel="stylesheet" href="/assets/fixture.css">
  <script defer src="/assets/fixture.js"></script>
</head>
<body>
  <main>
    <h1>Popup policy</h1>
    <a id="target-blank" href="/second-page.html" target="_blank"
       rel="opener">Open target blank</a>
    <button id="script-popup" type="button">Call window.open</button>
    <output id="popup-result">not attempted</output>
  </main>
  <script>
    document.querySelector("#script-popup").addEventListener("click", () => {
      const popup = window.open("/second-page.html", "pilot-fixture-popup");
      document.querySelector("#popup-result").value = popup ? "opened" : "blocked";
    });
  </script>
</body>
</html>
